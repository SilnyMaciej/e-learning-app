<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotlin Masterclass - Praktyka Kodu</title>
    <link rel="stylesheet" href="kod.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Kotlin Masterclass</h1>
        </header>

        <section class="section-column">
            <div class="card-header-badge yellow">Praktyka</div>
            <h2>Uzupełnij Brakujący Kod</h2>
            <p class="section-description">Wpisz brakujące słowa kluczowe lub operatory w puste pola, aby program zadziałał poprawnie.</p>

            <div class="exercise-box">
                <div class="exercise-header">
                    <span class="exercise-title" id="exercise-title">Zadanie 1/3</span>
                    <span class="exercise-topic" id="exercise-topic">Temat</span>
                </div>
                <p class="exercise-instructions" id="exercise-instructions">Instrukcja ładuje się...</p>
                
                <div class="code-editor-mock">
                    <div class="editor-header">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                        <span class="file-name">main.kt</span>
                    </div>
                    <div class="code-lines" id="code-lines-container">
                        </div>
                </div>

                <div id="exercise-feedback" class="feedback-message"></div>

                <div class="controls-row">
                    <button class="btn btn-success" id="check-btn" onclick="checkExercise()">Sprawdź poprawność</button>
                    <button class="btn btn-primary" id="next-btn" onclick="nextExercise()">Kolejne zadanie ➔</button>
                </div>
            </div>
        </section>
    </div>

    <script src="kod.js"></script>
</body>
</html>
