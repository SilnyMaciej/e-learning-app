<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nowoczesny Quiz Kotlin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="quiz-container">
    <h1>Kotlin Quiz</h1>

    <div id="quiz-box" class="card">
      <div id="progress" class="quiz-progress"></div>
      <h2 id="question"></h2>

      <div class="answers">
        <button class="answer-btn" onclick="checkAnswer(0)"></button>
        <button class="answer-btn" onclick="checkAnswer(1)"></button>
        <button class="answer-btn" onclick="checkAnswer(2)"></button>
        <button class="answer-btn" onclick="checkAnswer(3)"></button>
      </div>

      <div id="feedback" class="feedback-msg"></div>
      <button id="next-btn" class="next-btn" onclick="nextQuestion()" style="display: none;">Następne pytanie</button>
    </div>

    <div id="result-box" class="card" style="display: none;">
      <h2>Koniec Quizu!</h2>
      <p id="result-text"></p>
      <button class="reset-btn" onclick="resetQuiz()" style="text-align: center; width: 100%;">Zacznij od nowa</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
